name: Build Hesabati APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: |
          echo "--- repo files ---"
          ls -la
          npm install --no-audit --no-fund

      - name: Prepare Website
        run: |
          for f in index.html sw.js manifest.json capacitor.config.json; do
            test -f "$f" || { echo "::error::الملف $f مش موجود في جذر الريبو"; exit 1; }
          done
          test -d icons || { echo "::error::فولدر icons مش موجود في جذر الريبو"; exit 1; }
          rm -rf www
          mkdir -p www/vendor
          cp index.html sw.js manifest.json www/
          cp -r icons www/icons
          copy_lib() {
            if [ -f "node_modules/$2" ]; then
              cp "node_modules/$2" "www/vendor/$3"
              sed -i "s|$1|vendor/$3|g" www/index.html
            else
              echo "::warning::node_modules/$2 مش موجود - هيفضل رابط CDN"
            fi
          }
          copy_lib "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" chart.js/dist/chart.umd.js chart.umd.js
          copy_lib "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" xlsx/dist/xlsx.full.min.js xlsx.full.min.js
          copy_lib "https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js" firebase/firebase-app-compat.js firebase-app-compat.js
          copy_lib "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js" firebase/firebase-auth-compat.js firebase-auth-compat.js
          copy_lib "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js" firebase/firebase-firestore-compat.js firebase-firestore-compat.js
          echo "--- www ---"
          ls -R www | head -40

      - name: Verify Capacitor Config
        run: |
          cat capacitor.config.json
          node -e "const c = require('./capacitor.config.json'); if (!c.appId) throw new Error('Missing appId'); if (!c.appName) throw new Error('Missing appName'); if (c.webDir !== 'www') throw new Error('webDir must be www'); console.log('OK', c.appId);"

      - name: Add Android
        run: '[ -d android ] || npx cap add android'

      - name: Generate Icons and Splash
        run: |
          if [ -d resources ]; then
            npx --yes @capacitor/assets generate --android
          else
            echo "::warning::فولدر resources مش موجود - هتتستخدم الأيقونة الافتراضية"
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesabati-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
